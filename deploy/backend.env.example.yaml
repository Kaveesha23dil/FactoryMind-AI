FACTORYMIND_ENV: production
FACTORYMIND_PERSISTENCE: firestore
FACTORYMIND_FIRESTORE_DATABASE: "(default)"
FACTORYMIND_FIRESTORE_PREFIX: factorymind
FACTORYMIND_UPLOAD_BACKEND: gcs
FACTORYMIND_UPLOAD_BUCKET: REPLACE_PRIVATE_BUCKET
GOOGLE_CLOUD_PROJECT: REPLACE_PROJECT
FACTORYMIND_AUTH_AUDIENCE: https://REPLACE_BACKEND.run.app
FACTORYMIND_API_CALLERS: factorymind-web@REPLACE_PROJECT.iam.gserviceaccount.com
FACTORYMIND_WORKER_CALLERS: factorymind-tasks@REPLACE_PROJECT.iam.gserviceaccount.com
FACTORYMIND_JOB_DISPATCH: tasks
FACTORYMIND_TASKS_QUEUE: projects/REPLACE_PROJECT/locations/REPLACE_REGION/queues/factorymind
FACTORYMIND_TASKS_TARGET: https://REPLACE_BACKEND.run.app
FACTORYMIND_TASKS_SERVICE_ACCOUNT: factorymind-tasks@REPLACE_PROJECT.iam.gserviceaccount.com
FACTORYMIND_TASKS_DEADLINE: "900"
FACTORYMIND_INVESTIGATION_ASYNC: "true"
FACTORYMIND_INVESTIGATION_TIMEOUT_SECONDS: "40"
FACTORYMIND_INVESTIGATION_MAX_RETRIES: "1"
FACTORYMIND_GEMINI_CONCURRENCY: "1"
FACTORYMIND_GEMINI_MAX_MODEL_CALLS: "4"
FACTORYMIND_INVESTIGATION_CACHE_ENABLED: "true"
FACTORYMIND_PROVIDER_COOLDOWN_ENABLED: "true"
FACTORYMIND_PROMPT_VERSION: grounded-v2
FACTORYMIND_CORS_ORIGINS: http://localhost:8080
AI_PROVIDER: google
AI_INVESTIGATION_ENABLED: "true"
GEMINI_MODEL: gemini-3.8-flash
GOOGLE_GENAI_USE_VERTEXAI: "false"
